services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: metering
      POSTGRES_PASSWORD: metering
      POSTGRES_DB: metering
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metering -d metering"]
      interval: 3s
      timeout: 3s
      retries: 20

  service:
    build: ./service
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://metering:metering@db:5432/metering
      # total Postgres connections = WEB_CONCURRENCY x DB_POOL_MAX (Postgres allows 100 by default)
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not "localhost": in Alpine "localhost" can resolve to IPv6 (::1) while the server listens on IPv4 only
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Example client app: http://localhost:8080
  client:
    build: ./client
    environment:
      SERVICE_URL: http://service:3000
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      PORT: "8080"
    volumes:
      - clientdata:/data # the demo companies and their API keys survive "docker compose down"
    ports:
      - "8080:8080"
    depends_on:
      service:
        condition: service_healthy

  # Load tests (not started by "up"): docker compose --profile perf run --rm k6 run -e SCENARIO=hot_account /perf/load.js
  k6:
    image: grafana/k6:latest
    profiles: ["perf"]
    user: root
    working_dir: /perf
    volumes:
      - ./perf:/perf
    environment:
      BASE_URL: http://service:3000
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
    depends_on:
      service:
        condition: service_healthy

volumes:
  pgdata:
  clientdata: