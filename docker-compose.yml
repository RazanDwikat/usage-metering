services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: metering
      POSTGRES_PASSWORD: metering
      POSTGRES_DB: metering
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metering -d metering"]
      interval: 3s
      timeout: 3s
      retries: 20

  service:
    build: ./service
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://metering:metering@db:5432/metering
      DB_POOL_MAX: "20"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # client (example app) is added in a later phase

volumes:
  pgdata:
